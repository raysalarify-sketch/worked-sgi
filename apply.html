<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGI 서울보증보험 — 보증보험 접수</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1356A2;--blue2:#2A72CC;--blue-light:#E8F1FB;--blue-pale:#F0F6FF;
  --green:#0A6B50;--green-light:#E2F5EF;
  --amber:#7D4800;--amber-light:#FEF3E2;
  --red:#9B2222;--red-light:#FDECEA;
  --bg:#F4F7FC;--bg2:#FFFFFF;--bg3:#EEF2F8;--bg4:#E5EAF3;
  --border:#D8DFE9;--border2:#C4CDD9;
  --text:#18202E;--text2:#4A566A;--text3:#8494AB;
  --r:8px;--rlg:14px;--rxl:20px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* ── HERO HEADER ── */
.hero{background:linear-gradient(135deg,#0C3B7A 0%,#1356A2 55%,#1D6FC4 100%);color:#fff;padding:0}
.hero-inner{max-width:1100px;margin:0 auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero-brand{display:flex;align-items:center;gap:12px}
.hero-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:5px;letter-spacing:.8px}
.hero-title{font-size:18px;font-weight:700;line-height:1.2}
.hero-sub{font-size:12px;opacity:.7;margin-top:2px}
.hero-nav a{color:rgba(255,255,255,.75);font-size:12px;text-decoration:none;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);font-weight:500;transition:all .2s}
.hero-nav a:hover,.hero-nav a.active{background:rgba(255,255,255,.18);color:#fff}
.hero-tabs{background:rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.1)}
.hero-tabs-inner{max-width:1100px;margin:0 auto;padding:0 28px;display:flex;gap:0;overflow-x:auto}
.htab{padding:13px 18px;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer;border:none;background:none;font-family:inherit;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.htab:hover{color:#fff}
.htab.active{color:#fff;border-bottom-color:#61AEFF}

/* ── LAYOUT ── */
.main{max-width:1100px;margin:0 auto;padding:28px}
.step-indicator{display:flex;align-items:center;gap:0;margin-bottom:28px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rlg);padding:16px 20px;box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg4);color:var(--text3);flex-shrink:0;transition:all .3s}
.step.done .step-num{background:var(--green-light);color:var(--green)}
.step.active .step-num{background:var(--blue);color:#fff}
.step-label{font-size:12px;font-weight:500;color:var(--text3)}
.step.active .step-label{color:var(--blue);font-weight:700}
.step.done .step-label{color:var(--green)}
.step-sep{width:40px;height:1px;background:var(--border);flex-shrink:0}

/* ── SECTION ── */
.section{display:none}.section.active{display:block}
.section-hd{margin-bottom:20px}
.section-hd h2{font-size:20px;font-weight:700;margin-bottom:4px}
.section-hd p{font-size:13px;color:var(--text3)}

/* ── CATEGORY TABS ── */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px}
.cat-scroll::-webkit-scrollbar{height:3px}
.cat-scroll::-webkit-scrollbar-track{background:var(--border)}
.cat-scroll::-webkit-scrollbar-thumb{background:var(--blue2);border-radius:10px}
.cat-btn{padding:7px 16px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg2);color:var(--text2);white-space:nowrap;transition:all .15s;font-family:inherit}
.cat-btn:hover{border-color:var(--blue2);color:var(--blue)}
.cat-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── PRODUCT GRID ── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pc{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rlg);padding:15px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.pc::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(19,86,162,.04),transparent);opacity:0;transition:.2s}
.pc:hover{border-color:var(--blue2);box-shadow:var(--shadow);transform:translateY(-1px)}
.pc:hover::after{opacity:1}
.pc.selected{border-color:var(--blue);background:var(--blue-pale);box-shadow:0 0 0 3px rgba(19,86,162,.1)}
.pc-icon{font-size:26px;margin-bottom:8px;display:block}
.pc-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.pc-desc{font-size:11px;color:var(--text3);line-height:1.4}
.pc-cat{font-size:10px;background:var(--bg3);color:var(--text3);padding:2px 8px;border-radius:20px;margin-top:8px;display:inline-block;font-weight:600}
.pc.selected .pc-cat{background:rgba(19,86,162,.12);color:var(--blue)}
.pc-addons{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.pc-addon{font-size:9px;background:var(--blue-light);color:var(--blue);padding:2px 6px;border-radius:10px;font-weight:700}
.pc-select-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;display:none;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.pc.selected .pc-select-check{display:flex}

/* ── FORM CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg3)}
.card-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.form-row.c1{grid-template-columns:1fr}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px}
.form-group label .req{color:#D94141;margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:var(--text);font-family:inherit;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(42,114,204,.1)}
.form-group textarea{resize:none;line-height:1.5}
.form-group input[readonly]{background:var(--bg3);color:var(--text2)}

/* ── DOC UPLOAD ── */
.doc-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;background:var(--bg3);transition:all .2s}
.doc-item.uploaded{background:var(--green-light);border-color:#A8DCC7}
.doc-left{display:flex;align-items:center;gap:10px}
.doc-icon{font-size:18px}
.doc-name{font-size:13px;font-weight:500}
.doc-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.req-tag{background:#FDECEA;color:#9B2222}
.opt-tag{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.upload-btn{font-size:12px;padding:6px 16px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;background:#fff;color:var(--text2);font-weight:600;transition:all .15s;font-family:inherit}
.upload-btn:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue2)}
.upload-btn.done{background:var(--green-light);color:var(--green);border-color:#A8DCC7;cursor:default}

/* ── BUTTONS ── */
.btn{padding:10px 22px;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0C3B7A}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg3)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#085542}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-lg{padding:13px 32px;font-size:15px}
.action-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;padding:16px 24px;border:1px solid #1356A2;background:#fff;border-radius:var(--rlg);position:sticky;bottom:24px;z-index:100;box-shadow:0 10px 30px rgba(19,86,162,0.2)}

/* ── LOAN CALCULATOR ── */
.calc-result{background:linear-gradient(135deg,var(--blue-pale),var(--blue-light));border:1px solid #C2D8F0;border-radius:var(--rlg);padding:18px;margin-top:14px}
.calc-main-label{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:4px}
.calc-main-val{font-size:28px;font-weight:900;color:var(--blue);margin-bottom:12px;letter-spacing:-.5px}
.calc-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cs-item{background:rgba(255,255,255,.7);border-radius:var(--r);padding:10px 12px}
.cs-label{font-size:11px;color:var(--text3);margin-bottom:3px}
.cs-val{font-size:15px;font-weight:700;color:var(--text)}
.amort-wrap{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r);margin-top:12px}
.amort-table{width:100%;border-collapse:collapse;font-size:12px}
.amort-table th{padding:7px 10px;background:var(--bg3);border-bottom:1px solid var(--border);font-weight:700;color:var(--text3);text-align:right;position:sticky;top:0}
.amort-table th:first-child{text-align:left}
.amort-table td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--text)}
.amort-table td:first-child{text-align:left;color:var(--text2);font-weight:500}
.amort-table tr:last-child td{border-bottom:none}

/* ── LEASE MANAGER ── */
.dday-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.dday-ok{background:var(--green-light);color:var(--green)}
.dday-warn{background:var(--amber-light);color:var(--amber)}
.dday-danger{background:var(--red-light);color:var(--red)}
.dday-past{background:var(--bg4);color:var(--text3)}
.req-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;background:var(--bg3)}
.req-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.rb-green{background:var(--green-light);color:var(--green)}
.rb-red{background:var(--red-light);color:var(--red)}
.rb-blue{background:var(--blue-light);color:var(--blue)}
.rb-gray{background:var(--bg4);color:var(--text3)}

/* ── PROGRESS ── */
.prog-bar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue2),#61AEFF);border-radius:4px;transition:width .5s ease}

/* ── SUBMIT CONFIRM ── */
.confirm-card{background:linear-gradient(135deg,#0C3B7A,#1356A2);color:#fff;border-radius:var(--rxl);padding:32px;text-align:center;margin-bottom:20px}
.confirm-icon{font-size:48px;margin-bottom:12px}
.confirm-title{font-size:22px;font-weight:900;margin-bottom:8px}
.confirm-sub{font-size:14px;opacity:.8;line-height:1.6}
.confirm-id{font-size:24px;font-weight:900;background:rgba(255,255,255,.2);border-radius:var(--r);padding:12px 24px;display:inline-block;margin-top:16px;letter-spacing:1px}
.info-table{width:100%;border-collapse:collapse}
.info-table td{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.info-table td:first-child{color:var(--text3);width:140px;font-weight:600}
.info-table tr:last-child td{border-bottom:none}

/* ── REQUIRED DOCS SUMMARY ── */
.doc-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.doc-chip{padding:7px 12px;border-radius:var(--r);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.dc-req{background:var(--blue-light);color:var(--blue);border:1px solid #C2D8F0}
.dc-opt{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.dc-done{background:var(--green-light);color:var(--green);border:1px solid #A8DCC7}

/* ── STATUS PAGE ── */
.status-timeline{padding:0}
.tl-item{display:flex;gap:14px;padding-bottom:20px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid var(--border)}
.tl-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.tl-dot.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tl-dot.pending{background:#fff;border-color:var(--border)}
.tl-line{position:absolute;left:15px;top:36px;bottom:0;width:2px;background:var(--border)}
.tl-item:last-child .tl-line{display:none}
.tl-content h4{font-size:14px;font-weight:700;margin-bottom:2px}
.tl-content p{font-size:12px;color:var(--text3)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rlg);padding:13px 20px;font-size:13px;z-index:9999;display:none;font-weight:600;box-shadow:var(--shadow-md);max-width:320px}
.toast.show{display:block}
.toast.success{border-left:4px solid var(--green);color:var(--green)}
.toast.info{border-left:4px solid var(--blue);color:var(--blue)}
.toast.warn{border-left:4px solid var(--amber);color:var(--amber)}

@media(max-width:700px){
  .hero-inner{flex-direction:column;align-items:flex-start;gap:12px}
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .form-row{grid-template-columns:1fr}
  .form-row.c3{grid-template-columns:1fr}
  .calc-summary{grid-template-columns:1fr 1fr}
  .doc-summary{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-brand">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <span class="hero-badge">SGI</span>
          <div class="hero-title">서울보증보험 대리점</div>
        </div>
        <div class="hero-sub">보증보험 온라인 접수 시스템 — 빠르고 간편한 보증보험 신청</div>
      </div>
    </div>
    <div class="hero-nav">
      <a href="admin.html">관리자 로그인 →</a>
    </div>
  </div>
  <div class="hero-tabs">
    <div class="hero-tabs-inner">
      <button class="htab active" onclick="gotoSection('s-product',this)">① 상품 선택</button>
      <button class="htab" onclick="gotoSection('s-form',this)">② 정보 입력</button>
      <button class="htab" onclick="gotoSection('s-confirm',this)">③ 접수 완료</button>
      <button class="htab" onclick="gotoSection('s-status',this)">④ 접수 조회</button>
    </div>
  </div>
</div>

<div class="main">

  <!-- STEP INDICATOR -->
  <div class="step-indicator" id="stepIndicator">
    <div class="step active" id="step1"><div class="step-num">1</div><div class="step-label">상품 선택</div></div>
    <div class="step-sep"></div>
    <div class="step" id="step2"><div class="step-num">2</div><div class="step-label">정보 입력 & 서류</div></div>
    <div class="step-sep"></div>
    <div class="step" id="step3"><div class="step-num">3</div><div class="step-label">접수 완료</div></div>
    <div class="step-sep"></div>
    <div class="step" id="step4"><div class="step-num">4</div><div class="step-label">접수 조회</div></div>
  </div>

  <!-- ① 상품 선택 -->
  <div class="section active" id="s-product">
    <div class="section-hd">
      <h2>보증 상품 선택</h2>
      <p>신청하실 보증보험 상품을 선택해주세요. 카테고리별로 찾아보실 수 있습니다.</p>
    </div>
    <div class="cat-scroll" id="catScroll"></div>
    <div class="products-grid" id="productGrid"></div>
    <div class="action-bar" id="productActionBar" style="display:none">
      <div style="flex:1;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px">
        <span id="selectedProductName" style="font-weight:700;color:var(--blue)"></span>이(가) 선택되었습니다
      </div>
      <button class="btn btn-primary btn-lg" onclick="gotoForm()">다음 단계 — 정보 입력 →</button>
    </div>
  </div>

  <!-- ② 정보 입력 -->
  <div class="section" id="s-form">
    <div class="section-hd">
      <h2 id="formTitle">신청 정보 입력</h2>
      <p>필수 항목(*)을 모두 입력하고 서류를 업로드해주세요</p>
    </div>
    <div id="formContent"></div>
  </div>

  <!-- ③ 접수 완료 -->
  <div class="section" id="s-confirm">
    <div id="confirmContent"></div>
  </div>

  <!-- ④ 접수 조회 -->
  <div class="section" id="s-status">
    <div class="section-hd">
      <h2>접수 내역 조회</h2>
      <p>접수번호 또는 연락처로 진행 상태를 확인하세요</p>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="form-row" style="margin-bottom:0">
          <div class="form-group">
            <label>접수번호</label>
            <input type="text" id="statusSearchId" placeholder="예: A2024-0041">
          </div>
          <div class="form-group">
            <label>연락처</label>
            <input type="text" id="statusSearchTel" placeholder="예: 010-1234-5678">
          </div>
        </div>
      </div>
      <div style="padding:0 20px 16px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="searchStatus()">조회하기</button>
        <button class="btn btn-secondary" onclick="document.getElementById('statusResult').innerHTML=''">초기화</button>
      </div>
    </div>
    <div id="statusResult"></div>
  </div>

</div><!-- /main -->

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
// ── LOCAL STORAGE KEY ──
const STORAGE_KEY = 'sgi_applications';

function loadApps() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [...SAMPLE_APPLICATIONS];
  } catch { return [...SAMPLE_APPLICATIONS]; }
}
function saveApps(apps) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
}

window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) {
    apps = loadApps();
    if (document.getElementById('s-status').classList.contains('active')) {
      searchStatus();
    }
  }
});

let apps = loadApps();
let selectedProductId = null;
let uploadedDocs = {};
let leaseReqs = [];

// ── SECTIONS ──
function gotoSection(id, tabBtn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.htab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (tabBtn) tabBtn.classList.add('active');
  const idx = ['s-product','s-form','s-confirm','s-status'].indexOf(id);
  updateSteps(idx);
}
function updateSteps(active) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step'+i);
    el.classList.remove('active','done');
    if (i-1 < active) el.classList.add('done');
    else if (i-1 === active) el.classList.add('active');
  }
}

// ── CATEGORY & PRODUCTS ──
function renderCats() {
  const cats = ['전체', ...SGI_CATEGORIES];
  document.getElementById('catScroll').innerHTML = cats.map((c,i) =>

function buildLoanCalcSection(pfx) {
  return `

      </div>
      <div class="form-row">
        <div class="form-group"><label>대출기간 (개월)</label><input type="number" id="${pfx}-lm" value="36" min="1" max="480"></div>
        <div class="form-group"><label>상환방식</label>
          <select id="${pfx}-lt">
            <option value="annuity">원리금균등상환</option>
            <option value="principal">원금균등상환</option>
            <option value="bullet">만기일시상환</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="calcLoan('${pfx}')">상환금액 계산</button>
      <div id="${pfx}-lresult"></div>
      <div id="${pfx}-lamort"></div>
    </div>
  </div>`;

function calcLoan(pfx) {
  const principal = parseNum(document.getElementById(pfx+'-lp')?.value||'0');
  const rate      = parseFloat(document.getElementById(pfx+'-lr')?.value||'0');
  const months    = parseInt(document.getElementById(pfx+'-lm')?.value||'1');
  const type      = document.getElementById(pfx+'-lt')?.value||'annuity';
  if (!principal||!rate||!months) return;
  const r = rate/100/12;
  let rows=[],totalPay=0,totalInt=0;

  if (type==='annuity') {
    const mp = r===0 ? principal/months : principal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);
    let bal = principal;
    for (let m=1;m<=months;m++){
      const int=bal*r, pp=mp-int; bal-=pp; totalPay+=mp; totalInt+=int;
      rows.push({m,mp:Math.round(mp),int:Math.round(int),pp:Math.round(pp),bal:Math.max(0,Math.round(bal))});
    }
    renderLoanResult(pfx,'월 납입금',Math.round(mp),principal,Math.round(totalInt),Math.round(totalPay));
  } else if (type==='principal') {
    const ppFixed = principal/months; let bal=principal;
    for (let m=1;m<=months;m++){
      const int=bal*r, mp=ppFixed+int; bal-=ppFixed; totalPay+=mp; totalInt+=int;
      rows.push({m,mp:Math.round(mp),int:Math.round(int),pp:Math.round(ppFixed),bal:Math.max(0,Math.round(bal))});
    }
    renderLoanResult(pfx,'첫달 납입금',rows[0].mp,principal,Math.round(totalInt),Math.round(totalPay));
  } else {
    const monthlyInt = principal*r;
    const totalInt2 = monthlyInt*months;
    for (let m=1;m<=months;m++){
      rows.push({m,mp:Math.round(monthlyInt+(m===months?principal:0)),int:Math.round(monthlyInt),pp:m===months?principal:0,bal:m===months?0:principal});
    }
    renderLoanResult(pfx,'월 이자',Math.round(monthlyInt),principal,Math.round(totalInt2),Math.round(principal+totalInt2));
  }

  const amortEl = document.getElementById(pfx+'-lamort');
  if (amortEl) amortEl.innerHTML=`
    <div class="amort-wrap">
      <table class="amort-table">
        <thead><tr><th>회차</th><th>월납입액</th><th>이자</th><th>원금</th><th>잔액</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.m}회</td><td>${r.mp.toLocaleString()}</td><td>${r.int.toLocaleString()}</td><td>${r.pp.toLocaleString()}</td><td>${r.bal.toLocaleString()}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function renderLoanResult(pfx, label, monthly, principal, totalInt, totalPay) {
  const el = document.getElementById(pfx+'-lresult');
  if (!el) return;
  el.innerHTML=`
    <div class="calc-result">
      <div class="calc-main-label">${label}</div>
      <div class="calc-main-val">${monthly.toLocaleString()}원</div>
      <div class="calc-summary">
        <div class="cs-item"><div class="cs-label">대출원금</div><div class="cs-val">${principal.toLocaleString()}원</div></div>
        <div class="cs-item"><div class="cs-label">총 이자</div><div class="cs-val">${totalInt.toLocaleString()}원</div></div>
        <div class="cs-item"><div class="cs-label">총 납입액</div><div class="cs-val">${totalPay.toLocaleString()}원</div></div>
      </div>
    </div>`;
}

function leaseDdayUpdate(pfx) {
  const s = document.getElementById(pfx+'-ls')?.value;
  const e = document.getElementById(pfx+'-le')?.value;
  const el = document.getElementById(pfx+'-dday');
  if (!el||!s||!e) return;
  const diff = calcDday(e);
  let cls='dday-ok', txt='';
  if (diff<0){cls='dday-past';txt=`만기 (${Math.abs(diff)}일 경과)`;}
  else if (diff===0){cls='dday-danger';txt='오늘 만기';}
  else if (diff<=30){cls='dday-danger';txt=`D-${diff}`;}
  else if (diff<=90){cls='dday-warn';txt=`D-${diff}`;}
  else{cls='dday-ok';txt=`D-${diff}`;}
  el.innerHTML=`<div style="display:flex;align-items:center;gap:10px;font-size:13px">
    계약 만기까지
    <span class="dday-chip ${cls}">${txt}</span>
    <span style="color:var(--text3)">(만기일: ${e})</span>
  </div>`;
}

  const contact = document.getElementById('f-contact')?.value?.trim()||'';
  const amount  = parseNum(document.getElementById('f-amount')?.value||'0');
  const period  = document.getElementById('f-period')?.value?.trim()||'';
  const memo    = document.getElementById('f-memo')?.value?.trim()||'';

  if (!name)    { showToast('신청인/회사명을 입력해주세요','warn'); return; }
  if (!contact) { showToast('연락처를 입력해주세요','warn'); return; }
  if (!amount)  { showToast('보증금액을 입력해주세요','warn'); return; }

  const p = SGI_PRODUCTS.find(x => x.id===selectedProductId);
  
  const dynamicFields = {};
  if (p && p.fields) {
    p.fields.forEach(f => {
      const el = document.getElementById('f-dyn-' + f.k);
      if (el) dynamicFields[f.k] = el.value.trim();
    });
  }

  const newId = 'A'+new Date().getFullYear()+'-'+String(apps.length+50).padStart(4,'0');
  const app = {
    id:newId, name, contact,
    productId:p.id, product:p.name,
    amount, period, date:today(), status:'접수대기',
    docs:{...uploadedDocs}, memo, leaseReqs:[...leaseReqs], fieldsData: dynamicFields
  };
  apps.unshift(app);
  saveApps(apps);

  renderConfirm(app, p);
  gotoSection('s-confirm');
  document.querySelectorAll('.htab')[2].classList.add('active');
  document.querySelectorAll('.htab').forEach((t,i)=>{ if(i!==2) t.classList.remove('active'); });
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderConfirm(app, p) {
  const docDone = Object.values(app.docs).filter(Boolean).length;
  const docTotal = p.docs.length + (p.optDocs?.length||0);
  document.getElementById('confirmContent').innerHTML=`
    <div class="confirm-card">
      <div class="confirm-icon">✅</div>
      <div class="confirm-title">접수가 완료되었습니다</div>
      <div class="confirm-sub">담당자 확인 후 <strong>1~2 영업일 내</strong>에 연락드리겠습니다<br>접수번호를 메모해두시면 진행 상태를 조회하실 수 있습니다</div>
      <div class="confirm-id">${app.id}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📋 접수 내용 확인</h3></div>
      <div class="card-body">
        <table class="info-table">
          <tr><td>접수번호</td><td><strong>${app.id}</strong></td></tr>
          <tr><td>상품명</td><td>${p.icon} ${p.name}</td></tr>
          <tr><td>신청인</td><td>${app.name}</td></tr>
          <tr><td>연락처</td><td>${app.contact}</td></tr>
          <tr><td>보증금액</td><td>${app.amount.toLocaleString()}원</td></tr>
          <tr><td>보증기간</td><td>${app.period||'-'}</td></tr>
          <tr><td>접수일</td><td>${app.date}</td></tr>
          <tr><td>제출 서류</td><td>${docDone}건 제출 / 전체 ${docTotal}건</td></tr>
        </table>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="gotoSection('s-status');document.querySelectorAll('.htab')[3].classList.add('active');document.querySelectorAll('.htab')[2].classList.remove('active')">접수 조회 →</button>
      <button class="btn btn-primary" onclick="location.reload()">새 접수 신청</button>
    </div>
  `;
}

// ── STATUS SEARCH ──
function searchStatus() {
  const idQ   = document.getElementById('statusSearchId')?.value?.trim()||'';
  const telQ  = document.getElementById('statusSearchTel')?.value?.trim()||'';
  if (!idQ && !telQ) { showToast('접수번호 또는 연락처를 입력해주세요','warn'); return; }

  const found = apps.filter(a => {
    const idMatch  = idQ  && a.id.includes(idQ);
    const telMatch = telQ && a.contact.includes(telQ.replace(/-/g,''));
    return idMatch || telMatch;
  });

  const STATUS_STEPS = ['접수대기','서류검토','승인완료','증권발행'];
  const STATUS_ICON  = {'접수대기':'📥','서류검토':'🔍','승인완료':'✅','증권발행':'📜','반려':'❌','추가서류요청':'📋'};

  if (!found.length) {
    document.getElementById('statusResult').innerHTML=`
      <div class="card"><div class="card-body" style="text-align:center;padding:32px;color:var(--text3)">
        조회 결과가 없습니다. 접수번호 또는 연락처를 확인해주세요.
      </div></div>`;
    return;
  }

  document.getElementById('statusResult').innerHTML = found.map(a => {
    const p = SGI_PRODUCTS.find(x=>x.id===a.productId)||{icon:'📄',name:a.product};
    const curStep = STATUS_STEPS.indexOf(a.status);
    const isRejected = a.status==='반려';
    return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>${p.icon} ${p.name}</h3>
        <span style="font-size:11px;color:var(--text3)">${a.id}</span>
      </div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
          <div><span style="font-size:11px;color:var(--text3)">신청인</span><div style="font-weight:700">${a.name}</div></div>
          <div><span style="font-size:11px;color:var(--text3)">보증금액</span><div style="font-weight:700">${a.amount.toLocaleString()}원</div></div>
          <div><span style="font-size:11px;color:var(--text3)">접수일</span><div style="font-weight:700">${a.date}</div></div>
          <div><span style="font-size:11px;color:var(--text3)">현재상태</span><div><span style="font-weight:700;color:${isRejected?'var(--red)':'var(--blue)'}">${STATUS_ICON[a.status]||''} ${a.status}</span></div></div>
        </div>
        ${isRejected ? `
          <div style="background:var(--red-light);border:1px solid #F5B5B5;border-radius:var(--r);padding:12px;font-size:13px;color:var(--red)">
            ❌ 반려 사유: ${a.memo||'담당자에게 문의해주세요'}
          </div>` : `
          <div class="status-timeline">
            ${STATUS_STEPS.map((step,i)=>`
              <div class="tl-item">
                ${i<STATUS_STEPS.length-1?'<div class="tl-line"></div>':''}
                <div class="tl-dot ${i<curStep?'done':i===curStep?'active':'pending'}">${i<curStep?'✓':STATUS_ICON[step]||'○'}</div>
                <div class="tl-content">
                  <h4 style="color:${i===curStep?'var(--blue)':i<curStep?'var(--green)':'var(--text3)'}">${step}</h4>
                  <p>${i<curStep?'완료':i===curStep?'현재 처리 중':'대기 중'}</p>
                </div>
              </div>`).join('')}
          </div>`}
        ${a.memo && !isRejected ? `<div style="background:var(--bg3);border-radius:var(--r);padding:10px 12px;margin-top:12px;font-size:12px;color:var(--text2)">📌 ${a.memo}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── INIT ──
renderCats();
renderProducts();
</script>
</body>
</html>
