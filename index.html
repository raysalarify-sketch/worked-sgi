<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGI 서울보증보험 대리점 관리시스템</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;--blue-dark:#0C447C;
  --green:#0F6E56;--green-light:#E1F5EE;
  --amber:#854F0B;--amber-light:#FAEEDA;
  --red:#A32D2D;--red-light:#FCEBEB;
  --teal:#1D9E75;--teal-light:#E1F5EE;
  --bg:#F8F9FB;--bg2:#fff;--bg3:#F1F3F6;
  --border:#E2E6EC;--border2:#CDD2DA;
  --text:#1A1D23;--text2:#5A6272;--text3:#8C95A6;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── TOPBAR ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.brand-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;letter-spacing:.5px}
.brand-info h1{font-size:15px;font-weight:700;color:var(--text)}
.brand-info p{font-size:11px;color:var(--text3)}
.nav{display:flex;gap:2px}
.nav-btn{padding:7px 16px;font-size:13px;border:none;background:none;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-weight:500;transition:all .15s;position:relative}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--blue-light);color:var(--blue)}
.nav-badge{background:#E24B4A;color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-actions .export-btn{font-size:12px;padding:6px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text2);font-weight:500;transition:all .15s}
.topbar-actions .export-btn:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}

/* ── LAYOUT ── */
.content{max-width:1160px;margin:0 auto;padding:24px}
.page{display:none}.page.active{display:block}

/* ── SECTION HEADER ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-hd h2{font-size:16px;font-weight:700;color:var(--text)}
.section-hd p{font-size:12px;color:var(--text3);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card+.card{margin-top:14px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:16px}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── PRODUCT GRID ── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-bottom:20px}
.product-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .15s}
.product-card:hover{border-color:var(--blue-mid);box-shadow:var(--shadow)}
.product-card.selected{border-color:var(--blue);background:var(--blue-light)}
.pc-icon{font-size:24px;margin-bottom:8px}
.pc-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.pc-desc{font-size:11px;color:var(--text3);line-height:1.4}
.pc-cat{font-size:10px;background:var(--bg3);color:var(--text3);padding:2px 8px;border-radius:20px;margin-top:7px;display:inline-block;font-weight:500}
.product-card.selected .pc-cat{background:rgba(24,95,165,.15);color:var(--blue)}

/* ── FORMS ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.col3{grid-template-columns:1fr 1fr 1fr}
.form-row.single{grid-template-columns:1fr}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-group label .req{color:#E24B4A;margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 11px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);transition:border .15s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue-mid)}
.form-group textarea{resize:none;line-height:1.5}
.form-group input[readonly]{background:var(--bg3);color:var(--text2)}

/* ── DOC UPLOAD ── */
.doc-upload-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.doc-upload-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);transition:all .15s}
.doc-upload-item.done{background:var(--green-light);border-color:#9FE1CB}
.doi-left{display:flex;align-items:center;gap:8px}
.doi-icon{font-size:16px}
.doi-name{font-size:13px;font-weight:500}
.doi-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.tag-req{background:#FCEBEB;color:#A32D2D}
.tag-opt{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.doi-upload-btn{font-size:12px;padding:5px 14px;border:1px solid var(--border2);border-radius:6px;cursor:pointer;background:var(--bg2);color:var(--text2);transition:all .15s;font-weight:500}
.doi-upload-btn:hover{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}
.doi-upload-btn.done{background:var(--green-light);color:var(--green);border-color:#9FE1CB;cursor:default}

/* ── BUTTONS ── */
.btn{padding:9px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg3)}
.btn-success{background:var(--teal);color:#fff}.btn-success:hover{background:var(--green)}
.btn-danger{background:#D85A30;color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 9px;font-size:11px}
.submit-bar{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}

/* ── TABLES ── */
.data-table{width:100%;border-collapse:collapse}
.data-table th{padding:10px 12px;font-size:11px;font-weight:700;color:var(--text3);text-align:left;background:var(--bg3);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
.data-table td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3);cursor:pointer}

/* ── STATUS BADGES ── */
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.b-wait{background:var(--amber-light);color:var(--amber)}
.b-review{background:var(--blue-light);color:var(--blue)}
.b-approved{background:#EAF3DE;color:#3B6D11}
.b-issued{background:var(--green-light);color:var(--green)}
.b-rejected{background:var(--red-light);color:var(--red)}
.b-extra{background:#FBEAF0;color:#993556}
.b-active{background:var(--green-light);color:var(--green)}
.b-expiring{background:var(--amber-light);color:var(--amber)}
.b-expired{background:var(--red-light);color:var(--red)}
.b-extended{background:#E6F1FB;color:#185FA5}
.b-terminated{background:var(--bg3);color:var(--text3)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:inherit}
.filter-bar input{flex:1;min-width:200px}
.filter-chip{font-size:12px;padding:5px 13px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--bg2);color:var(--text2);font-weight:500;transition:all .15s;white-space:nowrap}
.filter-chip:hover{border-color:var(--blue-mid);color:var(--blue)}
.filter-chip.on{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:300;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius-xl);width:700px;max-width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.modal.wide{width:900px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:2px 6px;border-radius:4px;line-height:1}
.modal-close:hover{background:var(--bg3)}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ── TABS ── */
.tab-bar{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:18px}
.tab-btn{padding:8px 16px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--text3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── LOAN CALCULATOR ── */
.calc-result{background:var(--blue-light);border:1px solid #B5D4F4;border-radius:var(--radius-lg);padding:16px 18px;margin-top:14px}
.calc-result-main{font-size:24px;font-weight:700;color:var(--blue);margin-bottom:8px}
.calc-result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cr-item{background:rgba(255,255,255,.7);border-radius:var(--radius);padding:10px 12px}
.cr-label{font-size:11px;color:var(--text3);margin-bottom:3px}
.cr-val{font-size:15px;font-weight:700;color:var(--text)}
.amort-table-wrap{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);margin-top:12px}
.amort-table{width:100%;border-collapse:collapse;font-size:12px}
.amort-table th{padding:7px 10px;background:var(--bg3);border-bottom:1px solid var(--border);font-weight:700;color:var(--text3);position:sticky;top:0;text-align:right}
.amort-table th:first-child{text-align:left}
.amort-table td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--text)}
.amort-table td:first-child{text-align:left;color:var(--text2)}
.amort-table tr:last-child td{border-bottom:none}

/* ── CONTRACT TIMELINE ── */
.contract-timeline{position:relative;padding-left:24px}
.ctl-item{position:relative;padding-bottom:18px}
.ctl-item:last-child{padding-bottom:0}
.ctl-dot{position:absolute;left:-24px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--border2)}
.ctl-dot.done{background:var(--teal)}
.ctl-dot.active{background:var(--blue)}
.ctl-dot.warn{background:#EF9F27}
.ctl-line{position:absolute;left:-19px;top:15px;bottom:0;width:2px;background:var(--border)}
.ctl-item:last-child .ctl-line{display:none}
.ctl-date{font-size:11px;color:var(--text3);margin-bottom:2px}
.ctl-label{font-size:13px;font-weight:600}
.ctl-sub{font-size:12px;color:var(--text2);margin-top:2px}

/* ── D-DAY CHIP ── */
.dday{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.dday.ok{background:var(--green-light);color:var(--green)}
.dday.warn{background:var(--amber-light);color:var(--amber)}
.dday.danger{background:var(--red-light);color:var(--red)}
.dday.past{background:var(--bg3);color:var(--text3)}

/* ── SMS BOX ── */
.sms-box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.tpl-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tpl-btn{font-size:11px;padding:4px 11px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--bg3);color:var(--text2);font-weight:500;transition:all .15s}
.tpl-btn:hover{border-color:var(--blue-mid);color:var(--blue);background:var(--blue-light)}
.sms-textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);resize:none;line-height:1.6;font-family:inherit}
.sms-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sms-count{font-size:12px;color:var(--text3)}

/* ── PRODUCT ADDON PANELS ── */
.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;background:var(--blue)}

/* ── DETAIL GRID ── */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.df .df-label{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.df .df-val{font-size:14px;font-weight:600}

/* ── INFO TABLE ── */
.info-table{width:100%;font-size:13px}
.info-table td{padding:7px 0;border-bottom:1px solid var(--border)}
.info-table td:first-child{color:var(--text3);width:110px;font-weight:500}
.info-table tr:last-child td{border-bottom:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 20px;font-size:13px;z-index:9999;display:none;font-weight:500;box-shadow:var(--shadow-md);max-width:340px}
.toast.show{display:block}
.toast.success{border-left:4px solid var(--teal);color:var(--green)}
.toast.info{border-left:4px solid var(--blue);color:var(--blue)}
.toast.warn{border-left:4px solid #EF9F27;color:var(--amber)}

/* ── CONTRACT LIST ── */
.contract-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--bg2);transition:all .15s}
.contract-item:hover{border-color:var(--blue-mid);background:var(--blue-light)}
.ci-left h4{font-size:13px;font-weight:700;margin-bottom:3px}
.ci-left p{font-size:12px;color:var(--text2)}
.ci-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── EXPIRY ALERT ── */
.expiry-alert{background:var(--amber-light);border:1px solid #FAC775;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--amber)}

/* ── PAGINATION ── */
.pagination{display:flex;justify-content:center;gap:4px;margin-top:14px}
.pg{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--bg2);color:var(--text2);font-weight:500}
.pg.active{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid)}

/* ── PRODUCT INFO PAGE ── */
.product-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.pi-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.pi-docs{margin-top:10px}
.pi-doc{font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;color:var(--text2)}
.pi-doc.req{color:var(--text)}
.pi-doc:last-child{border-bottom:none}

/* ── CHECKLIST ── */
.checklist-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.checklist-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--blue)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .addon-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .form-row.col3{grid-template-columns:1fr}
}

/* ── PRINT / EXPORT ── */
@media print{.topbar,.nav,.filter-bar,.submit-bar,.modal-overlay,.toast{display:none!important}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="brand-badge">SGI</span>
        <div class="brand-info">
          <h1>서울보증보험 대리점 관리시스템</h1>
          <p>보증보험 통합 접수 · 계약관리 · 문자발송 플랫폼</p>
        </div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('apply',this)">상품 접수</button>
    <button class="nav-btn" onclick="showPage('contracts',this)">계약 관리 <span class="nav-badge" id="expiryCount">2</span></button>
    <button class="nav-btn" onclick="showPage('admin',this)">접수 관리 <span class="nav-badge" id="pendingCount">3</span></button>
    <button class="nav-btn" onclick="showPage('products',this)">상품 안내</button>
  </div>
  <div class="topbar-actions">
    <button class="export-btn" onclick="exportCSV()">📥 CSV 내보내기</button>
    <button class="export-btn" onclick="exportJSON()">📦 JSON 내보내기</button>
  </div>
</div>

<!-- ════════════════════════════════════════════
     PAGE 1: 상품 접수
════════════════════════════════════════════ -->
<div class="content">
<div class="page active" id="page-apply">
  <div class="section-hd">
    <div><h2>보증 상품 접수</h2><p>접수할 상품을 선택하고 정보를 입력하세요</p></div>
  </div>
    <div id="catFilterBar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px"></div>
  <div class="products-grid" id="productGrid"></div>
  <div id="applyFormArea"></div>
</div>

<!-- ════════════════════════════════════════════
     PAGE 2: 계약 관리
════════════════════════════════════════════ -->
<div class="page" id="page-contracts">
  <div class="section-hd">
    <div><h2>계약 관리</h2><p>진행 중인 보증 계약의 만기·갱신·해지를 관리합니다</p></div>
    <button class="btn btn-primary btn-sm" onclick="openContractNewModal()">+ 계약 등록</button>
  </div>
  <div id="expiryAlerts"></div>
  <div class="filter-bar">
    <input type="text" id="contractSearch" placeholder="계약자명 · 계약번호 · 상품명 검색..." oninput="renderContracts()">
    <select id="contractStatusF" onchange="renderContracts()">
      <option value="">전체 상태</option>
      <option value="활성">활성</option>
      <option value="만기임박">만기임박</option>
      <option value="만기">만기</option>
      <option value="연장">연장</option>
      <option value="해지">해지</option>
    </select>
    <select id="contractProductF" onchange="renderContracts()">
      <option value="">전체 상품</option>
    </select>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="data-table">

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='admin') { renderAdminStats(); renderAdmin(); }
  if(name==='contracts') { renderContracts(); renderExpiryAlerts(); }
  if(name==='products') renderProductInfo();
}

let selectedCat = '';
const CATS = ['전체', ...new Set(PRODUCTS.map(p=>p.cat))];

function renderCatFilter() {
  const bar = document.getElementById('catFilterBar');
  if(!bar) return;
  bar.innerHTML = CATS.map(c=>`
    <button class="filter-chip ${(c==='전체'&&!selectedCat)||(c===selectedCat)?'on':''}" 
      onclick="selectCat('${c}')">${c}</button>
  `).join('');
}

function selectCat(cat) {
  selectedCat = cat==='전체' ? '' : cat;
  selectedProduct = null;
  uploadedDocs = {};
  document.getElementById('applyFormArea').innerHTML = '';
  renderCatFilter();
  renderProducts();
}

function renderProducts() {
  const list = selectedCat ? PRODUCTS.filter(p=>p.cat===selectedCat) : PRODUCTS;
  document.getElementById('productGrid').innerHTML = list.map(p=>`
    <div class="product-card ${selectedProduct===p.id?'selected':''}" onclick="selectProduct('${p.id}')">

    </div>
  `).join('');
}

function buildLoanCalcHtml(prefix) {
  return `
  <div class="card">
    <div class="card-title">💰 대출 상환 계산기</div>
    <div class="addon-grid">
      <div>
        <div class="form-row single"><div class="form-group"><label>대출금액 (원)</label><input type="text" id="${prefix}-loan-principal" value="100,000,000" oninput="calcLoan('${prefix}')"></div></div>
        <div class="form-row">
          <div class="form-group"><label>연이율 (%)</label><input type="number" id="${prefix}-loan-rate" value="4.5" step="0.1" min="0.1" max="30" oninput="calcLoan('${prefix}')"></div>
          <div class="form-group"><label>대출기간 (개월)</label><input type="number" id="${prefix}-loan-months" value="36" min="1" max="360" oninput="calcLoan('${prefix}')"></div>
        </div>
        <div class="form-row single"><div class="form-group"><label>상환방식</label>
          <select id="${prefix}-loan-type" onchange="calcLoan('${prefix}')">
            <option value="원리금균등">원리금균등상환</option>
            <option value="원금균등">원금균등상환</option>
            <option value="만기일시상환">만기일시상환</option>
          </select>
        </div></div>
        <button class="btn btn-primary btn-sm" onclick="calcLoan('${prefix}')">계산하기</button>
      </div>
      <div id="${prefix}-loan-result"><div style="font-size:13px;color:var(--text3);padding:20px 0;text-align:center">왼쪽에서 조건을 입력하고<br>계산하기를 눌러주세요</div></div>
    </div>
    <div id="${prefix}-loan-amort"></div>
  </div>`;
}

function calcLoan(prefix) {
  const rawPrincipal = document.getElementById(prefix+'-loan-principal')?.value||'0';
  const principal = parseInt(rawPrincipal.replace(/[^0-9]/g,''))||0;
  const rate = parseFloat(document.getElementById(prefix+'-loan-rate')?.value)||0;
  const months = parseInt(document.getElementById(prefix+'-loan-months')?.value)||1;
  const type = document.getElementById(prefix+'-loan-type')?.value||'원리금균등';
  if(!principal||!rate||!months) return;

  const r = rate/100/12;
  let rows=[], totalPay=0, totalInterest=0;

  if(type==='원리금균등') {
    const monthly = r===0 ? principal/months : principal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);
    let balance = principal;
    for(let m=1;m<=months;m++){
      const interest = balance*r;
      const principalPay = monthly-interest;
      balance -= principalPay;
      totalPay += monthly;
      totalInterest += interest;
      rows.push({m, monthly:Math.round(monthly), interest:Math.round(interest), principalPay:Math.round(principalPay), balance:Math.max(0,Math.round(balance))});
    }
    const resultEl = document.getElementById(prefix+'-loan-result');
    if(resultEl) resultEl.innerHTML = `
      <div class="calc-result">
        <div style="font-size:12px;color:var(--blue);margin-bottom:4px">월 납입금</div>
        <div class="calc-result-main">${Math.round(monthly).toLocaleString()}원</div>
        <div class="calc-result-grid">
          <div class="cr-item"><div class="cr-label">대출원금</div><div class="cr-val">${principal.toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 이자</div><div class="cr-val">${Math.round(totalInterest).toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 상환액</div><div class="cr-val">${Math.round(totalPay).toLocaleString()}원</div></div>
        </div>
      </div>`;
  } else if(type==='원금균등') {
    const principalMonthly = principal/months;
    let balance = principal;
    for(let m=1;m<=months;m++){
      const interest = balance*r;
      const monthly = principalMonthly+interest;
      balance -= principalMonthly;
      totalPay += monthly;
      totalInterest += interest;
      rows.push({m, monthly:Math.round(monthly), interest:Math.round(interest), principalPay:Math.round(principalMonthly), balance:Math.max(0,Math.round(balance))});
    }
    const firstPay = rows[0]?.monthly||0;
    const resultEl = document.getElementById(prefix+'-loan-result');
    if(resultEl) resultEl.innerHTML = `
      <div class="calc-result">
        <div style="font-size:12px;color:var(--blue);margin-bottom:4px">첫 달 납입금</div>
        <div class="calc-result-main">${firstPay.toLocaleString()}원</div>
        <div class="calc-result-grid">
          <div class="cr-item"><div class="cr-label">대출원금</div><div class="cr-val">${principal.toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 이자</div><div class="cr-val">${Math.round(totalInterest).toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 상환액</div><div class="cr-val">${Math.round(totalPay).toLocaleString()}원</div></div>
        </div>
      </div>`;
  } else {
    const totalInt = principal*r*months;
    const resultEl = document.getElementById(prefix+'-loan-result');
    if(resultEl) resultEl.innerHTML = `
      <div class="calc-result">
        <div style="font-size:12px;color:var(--blue);margin-bottom:4px">월 이자 납입금</div>
        <div class="calc-result-main">${Math.round(principal*r).toLocaleString()}원</div>
        <div class="calc-result-grid">
          <div class="cr-item"><div class="cr-label">만기 상환액</div><div class="cr-val">${principal.toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 이자</div><div class="cr-val">${Math.round(totalInt).toLocaleString()}원</div></div>
          <div class="cr-item"><div class="cr-label">총 납입액</div><div class="cr-val">${Math.round(principal+totalInt).toLocaleString()}원</div></div>
        </div>
      </div>`;
    for(let m=1;m<=months;m++){
      const interest = principal*r;
      rows.push({m, monthly:Math.round(interest+(m===months?principal:0)), interest:Math.round(interest), principalPay:m===months?principal:0, balance:m===months?0:principal});
    }
  }

  const amortEl = document.getElementById(prefix+'-loan-amort');
  if(amortEl && rows.length) {
    amortEl.innerHTML=`
    <div class="amort-table-wrap" style="margin-top:12px">
      <table class="amort-table">
        <thead><tr><th>회차</th><th>월납입액</th><th>이자</th><th>원금</th><th>잔액</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.m}회</td><td>${r.monthly.toLocaleString()}</td><td>${r.interest.toLocaleString()}</td><td>${r.principalPay.toLocaleString()}</td><td>${r.balance.toLocaleString()}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  }
}

let leaseRequests = {};
function addLeaseRequest(prefix) {
  const type = document.getElementById(prefix+'-lease-reqtype')?.value;
  const note = document.getElementById(prefix+'-lease-reqnote')?.value||'';
  if(!type) return;
  if(!leaseRequests[prefix]) leaseRequests[prefix]=[];
  leaseRequests[prefix].push({type, note, date:today()});
  renderLeaseRequests(prefix);
  document.getElementById(prefix+'-lease-reqnote').value='';
}

function renderLeaseRequests(prefix) {
  const el = document.getElementById(prefix+'-lease-requests');
  if(!el) return;
  const reqs = leaseRequests[prefix]||[];
  if(!reqs.length) { el.innerHTML='<div style="font-size:12px;color:var(--text3)">등록된 요청 이력이 없습니다.</div>'; return; }
  el.innerHTML = reqs.map((r,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;background:var(--bg3)">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge ${r.type==='퇴거요청'||r.type==='계약해지'?'b-rejected':r.type==='연장요청'?'b-active':'b-review'}">${r.type}</span>
        <span style="font-size:13px">${r.note||'내용 없음'}</span>
      </div>
      <span style="font-size:11px;color:var(--text3)">${r.date}</span>
    </div>
  `).join('');
}

function updateLeaseDday(prefix) {
  const start = document.getElementById(prefix+'-lease-start')?.value;
  const end = document.getElementById(prefix+'-lease-end')?.value;
  const el = document.getElementById(prefix+'-lease-dday');
  if(!el||!start||!end) return;
  const today_ = new Date(); today_.setHours(0,0,0,0);
  const endDate = new Date(end);
  const diff = Math.round((endDate-today_)/(1000*60*60*24));
  let ddayClass='ok', ddayTxt='';
  if(diff<0){ ddayClass='past'; ddayTxt='만기됨 ('+(Math.abs(diff))+'일 경과)'; }
  else if(diff===0){ ddayClass='danger'; ddayTxt='오늘 만기'; }
  else if(diff<=30){ ddayClass='danger'; ddayTxt='D-'+diff; }
  else if(diff<=90){ ddayClass='warn'; ddayTxt='D-'+diff; }
  else { ddayClass='ok'; ddayTxt='D-'+diff; }
  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;font-size:13px"><span>계약 만기까지</span><span class="dday ${ddayClass}">${ddayTxt}</span><span style="color:var(--text3)">(${end})</span></div>`;
}

  return `

    <div class="form-row col3">
      <div class="form-group"><label>총 세대수</label><input type="number" id="${prefix}-unit-total" value="0" oninput="calcUnits('${prefix}')"></div>
      <div class="form-group"><label>분양 완료</label><input type="number" id="${prefix}-unit-sold" value="0" oninput="calcUnits('${prefix}')"></div>
      <div class="form-group"><label>미분양</label><input type="text" id="${prefix}-unit-unsold" readonly value="0세대"></div>
    </div>
    <div id="${prefix}-unit-bar-wrap" style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--text3)">분양률</span><span style="font-weight:700" id="${prefix}-unit-rate">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="${prefix}-unit-bar" style="width:0%"></div></div>
    </div>
  </div>`;
}
function calcUnits(prefix) {
  const total = parseInt(document.getElementById(prefix+'-unit-total')?.value||'0');
  const sold = parseInt(document.getElementById(prefix+'-unit-sold')?.value||'0');
  const unsold = Math.max(0,total-sold);
  const rate = total>0?Math.round(sold/total*100):0;
  const unsoldEl = document.getElementById(prefix+'-unit-unsold');
  const rateEl = document.getElementById(prefix+'-unit-rate');
  const barEl = document.getElementById(prefix+'-unit-bar');
  if(unsoldEl) unsoldEl.value=unsold+'세대';
  if(rateEl) rateEl.textContent=rate+'%';
  if(barEl) barEl.style.width=rate+'%';
}

function updateChecklist(prefix, total) {
  const checked = document.querySelectorAll(`[id^="${prefix}-chk-"]:checked`).length;
  const el = document.getElementById(prefix+'-chk-summary');
  if(el) el.textContent = `${checked} / ${total} 완료`;
}

function renderContracts() {
  const search = (document.getElementById('contractSearch')?.value||'').toLowerCase();
  const sf = document.getElementById('contractStatusF')?.value||'';
  const pf = document.getElementById('contractProductF')?.value||'';
  let filtered = contracts.filter(c=>{
    const ms = !search||(c.id+c.name+c.product).toLowerCase().includes(search);
    const mst = !sf||c.status===sf;
    const mp = !pf||c.product===pf;
    return ms&&mst&&mp;
  });
  const total = filtered.length;
  const pages = Math.max(1,Math.ceil(total/PAGE_SZ));
  if(contractPage>pages) contractPage=1;
  const paged = filtered.slice((contractPage-1)*PAGE_SZ, contractPage*PAGE_SZ);

  // Populate product filter
  const productNames=[...new Set(contracts.map(c=>c.product))];
  const cpf=document.getElementById('contractProductF');
  const cpfVal=cpf?.value||'';
  if(cpf) cpf.innerHTML='<option value="">전체 상품</option>'+productNames.map(n=>`<option value="${n}"${n===cpfVal?' selected':''}>${n}</option>`).join('');

  document.getElementById('contractTableBody').innerHTML = paged.length?paged.map(c=>{
    const dday = calcDday(c.endDate);
    return `<tr onclick="openContractDetail('${c.id}')">
      <td style="font-size:11px;color:var(--text3)">${c.id}</td>
      <td><strong>${c.name}</strong><br><span style="font-size:11px;color:var(--text3)">${c.contact}</span></td>
      <td>${c.product}</td>
      <td style="font-size:12px">${c.amount.toLocaleString()}원</td>
      <td style="font-size:11px;color:var(--text2)">${c.startDate}<br>${c.endDate}</td>
      <td style="font-size:12px">${c.endDate}</td>
      <td>${ddayBadge(dday)}</td>
      <td><span class="badge ${CONTRACT_STATUS_MAP[c.status]||'b-active'}">${c.status}</span></td>
      <td><button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();openContractDetail('${c.id}')">상세</button></td>
    </tr>`;
  }).join(''):
  '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text3)">등록된 계약이 없습니다</td></tr>';

  renderPagination('contractPagination', pages, contractPage, (p)=>{contractPage=p;renderContracts();});
}

function calcDday(endDate) {
  const now=new Date(); now.setHours(0,0,0,0);
  const end=new Date(endDate);
  return Math.round((end-now)/(1000*60*60*24));
}
function ddayBadge(diff) {
  if(diff<0) return `<span class="dday past">만기</span>`;
  if(diff===0) return `<span class="dday danger">D-0</span>`;
  if(diff<=30) return `<span class="dday danger">D-${diff}</span>`;
  if(diff<=90) return `<span class="dday warn">D-${diff}</span>`;
  return `<span class="dday ok">D-${diff}</span>`;
}

function renderExpiryAlerts() {
  const expiring = contracts.filter(c=>{ const d=calcDday(c.endDate); return d>=0&&d<=30&&c.status!=='해지'; });
  const el=document.getElementById('expiryAlerts');
  if(!el) return;
  if(!expiring.length){el.innerHTML='';return;}
  el.innerHTML=expiring.map(c=>`
    <div class="expiry-alert">
      ⚠️ <strong>${c.name}</strong> — ${c.product} 계약이 <strong>${calcDday(c.endDate)}일</strong> 후 만기됩니다 (${c.endDate})
      <button class="btn btn-xs" style="margin-left:auto;background:var(--amber-light);border:1px solid #FAC775;color:var(--amber)" onclick="openContractDetail('${c.id}')">확인</button>
    </div>
  `).join('');
  document.getElementById('expiryCount').textContent = expiring.length;
}

function addContractRequest(contractId) {
  const c=contracts.find(x=>x.id===contractId);
  if(!c) return;
  const type=document.getElementById('modal-reqtype')?.value;
  const note=document.getElementById('modal-reqnote')?.value||'';
  if(!type) return;
  if(!c.requests) c.requests=[];
  c.requests.push({type,note,date:today()});
  openContractDetail(contractId);
  showToast('요청 이력이 추가되었습니다.','success');
}

function updateContractStatus(id) {
  const c=contracts.find(x=>x.id===id);
  const sel=document.getElementById('contract-status-sel');
  if(!c||!sel) return;
  c.status=sel.value;
  renderContracts();
  renderExpiryAlerts();
  showToast('계약 상태가 변경되었습니다: '+c.status,'info');
}

function updateProgress(id) {
  const c=contracts.find(x=>x.id===id);
  const val=parseInt(document.getElementById('modal-progress')?.value||'0');
  if(!c) return;
  c.progress=val;
  showToast('진행률이 업데이트되었습니다: '+val+'%','success');
}

function showContractLoanCalc(id) {
  const c=contracts.find(x=>x.id===id);
  if(!c||!c.loanInfo) return;
  const {principal,rate,months,type}=c.loanInfo;
  const r=rate/100/12;
  let rows=[],totalInterest=0;
  if(type==='원리금균등') {
    const monthly=r===0?principal/months:principal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);
    let balance=principal;
    for(let m=1;m<=Math.min(months,12);m++){
      const interest=balance*r;
      const pp=monthly-interest;
      balance-=pp;
      totalInterest+=interest;
      rows.push({m,monthly:Math.round(monthly),interest:Math.round(interest),pp:Math.round(pp),balance:Math.max(0,Math.round(balance))});
    }
  }
  const el=document.getElementById('contract-loan-calc-result');
  if(!el) return;
  el.innerHTML=`
    <div class="amort-table-wrap" style="margin-top:10px">
      <table class="amort-table">
        <thead><tr><th>회차</th><th>월납입액</th><th>이자</th><th>원금</th><th>잔액</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.m}회</td><td>${r.monthly.toLocaleString()}</td><td>${r.interest.toLocaleString()}</td><td>${r.pp.toLocaleString()}</td><td>${r.balance.toLocaleString()}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    ${months>12?`<div style="font-size:11px;color:var(--text3);margin-top:4px;text-align:center">처음 12개월만 표시 (전체 ${months}개월)</div>`:''}
  `;
}

function setContractSms(type,id) {
  const c=contracts.find(x=>x.id===id);
  if(!c||!SMS_TPL[type]) return;
  const txt=SMS_TPL[type]({name:c.name,product:c.product});
  document.getElementById('contract-sms-content').value=txt;
  updateSmsCount('contract-sms');
}

function sendContractSms(id) {
  const content=document.getElementById('contract-sms-content')?.value||'';
  if(!content.trim()) {showToast('발송 내용을 입력해주세요','warn');return;}
  showToast('문자가 발송되었습니다.','success');
  document.getElementById('contract-sms-content').value='';
  updateSmsCount('contract-sms');
}

function addNewContract() {
  const name=document.getElementById('cn-name')?.value||'';
  if(!name) {showToast('계약자명을 입력해주세요','warn');return;}
  const newId='C2024-'+String(contracts.length+10).padStart(3,'0');
  contracts.unshift({
    id:newId,
    appId:null,
    name,
    contact:document.getElementById('cn-contact')?.value||'',
    product:document.getElementById('cn-product')?.value||PRODUCTS[0].name,
    amount:parseInt((document.getElementById('cn-amount')?.value||'0').replace(/[^0-9]/g,'')),
    startDate:document.getElementById('cn-start')?.value||today(),
    endDate:document.getElementById('cn-end')?.value||today(),
    status:'활성',
    memo:document.getElementById('cn-memo')?.value||'',
    requests:[],
    loanInfo:null,
  });
  closeModal('contractNewModal');
  renderContracts();
  renderExpiryAlerts();
  showToast('계약이 등록되었습니다: '+newId,'success');
}

        <div style="display:flex;align-items:center;gap:6px">
          <div class="progress-bar" style="width:60px;height:5px;display:inline-block;flex-shrink:0"><div class="progress-fill" style="width:${docCount?Math.round(docDone/docCount*100):0}%"></div></div>
          <span style="font-size:11px;color:var(--text3)">${docDone}/${docCount}</span>
        </div>
      </td>
      <td><span class="badge ${STATUS_MAP[a.status]||'b-wait'}">${a.status}</span></td>
      <td><button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();openAdminDetail('${a.id}')">상세</button></td>
    </tr>`;
  }).join(''):
  '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text3)">검색 결과가 없습니다</td></tr>';

  renderPagination('adminPagination',pages,adminPage,(p)=>{adminPage=p;renderAdmin();});
}

function adminChip(el) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  renderAdmin();
}

function openAdminDetail(id) {
  currentAppId=id;
  const a=applications.find(x=>x.id===id);
  if(!a) return;
  document.getElementById('adminModalTitle').textContent=a.id+' — '+a.name;
  const docHtml=Object.keys(a.docs).length?
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${Object.entries(a.docs).map(([k,v])=>`
      <div style="display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius);background:${v?'var(--green-light)':'var(--bg3)'};border:1px solid ${v?'#9FE1CB':'var(--border)'};font-size:12px;color:${v?'var(--green)':'var(--text3)'}">
        ${v?'✓':'○'} ${k}
      </div>`).join('')}</div>`:
    '<div style="font-size:12px;color:var(--text3)">업로드된 서류 없음</div>';

  document.getElementById('adminModalBody').innerHTML=`
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab(this,'am-basic')">기본 정보</button>
      <button class="tab-btn" onclick="switchTab(this,'am-docs')">서류 현황</button>
      <button class="tab-btn" onclick="switchTab(this,'am-sms')">문자 발송</button>
    </div>
    <div class="tab-panel active" id="am-basic">
      <div class="detail-grid">
        <div class="df"><div class="df-label">접수번호</div><div class="df-val">${a.id}</div></div>
        <div class="df"><div class="df-label">신청인</div><div class="df-val">${a.name}</div></div>
        <div class="df"><div class="df-label">연락처</div><div class="df-val">${a.contact}</div></div>
        <div class="df"><div class="df-label">상품명</div><div class="df-val">${a.product}</div></div>
        <div class="df"><div class="df-label">카테고리</div><div class="df-val" style="font-size:12px;color:var(--text3)">${(PRODUCTS.find(x=>x.name===a.product)||{}).cat||'-'}</div></div>
        <div class="df"><div class="df-label">보증금액</div><div class="df-val">${a.amount.toLocaleString()}원</div></div>
        <div class="df"><div class="df-label">접수일</div><div class="df-val">${a.date}</div></div>
      </div>
      ${a.memo?`<div style="background:var(--bg3);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text2)">메모: ${a.memo}</div>`:''}
      <div style="display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--bg3);border-radius:var(--radius)">
        <label style="font-size:13px;color:var(--text2);white-space:nowrap">상태 변경</label>
        <select id="admin-status-sel" style="flex:1;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius)">
          ${['접수대기','서류검토','승인완료','증권발행','반려','추가서류요청'].map(s=>`<option value="${s}"${s===a.status?' selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" onclick="updateAdminStatus('${a.id}')">저장</button>
      </div>
      <div style="margin-top:10px">
        <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">메모 수정</label>
        <textarea id="admin-memo" rows="2" style="width:100%;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);resize:none">${a.memo}</textarea>
        <button class="btn btn-secondary btn-xs" style="margin-top:4px" onclick="saveMemo('${a.id}')">메모 저장</button>
      </div>
    </div>
    <div class="tab-panel" id="am-docs">${docHtml}</div>
    <div class="tab-panel" id="am-sms">
      <div class="sms-box">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px">수신: ${a.name} (${a.contact})</div>
        <div class="tpl-grid">
          ${Object.keys(SMS_TPL).map(k=>`<button class="tpl-btn" onclick="setAdminSms('${k}','${a.id}')">${k}</button>`).join('')}
        </div>
        <textarea class="sms-textarea" id="admin-sms-content" rows="4" oninput="updateSmsCount('admin-sms')" placeholder="내용을 입력하거나 템플릿을 선택하세요"></textarea>
        <div class="sms-footer">
          <span class="sms-count" id="admin-sms-count">0 / 90자</span>
          <button class="btn btn-success btn-sm" onclick="sendAdminSms('${a.id}')">📨 문자 발송</button>
        </div>
      </div>
    </div>
  `;
  openModal('adminDetailModal');
}

function updateAdminStatus(id) {
  const a=applications.find(x=>x.id===id);
  const sel=document.getElementById('admin-status-sel');
  if(!a||!sel) return;
  a.status=sel.value;
  renderAdminStats();
  renderAdmin();
  updateBadges();
  showToast('상태 변경: '+a.status,'info');
}

function saveMemo(id) {
  const a=applications.find(x=>x.id===id);
  const val=document.getElementById('admin-memo')?.value||'';
  if(!a) return;
  a.memo=val;
  showToast('메모가 저장되었습니다.','success');
}

function setAdminSms(type,id) {
  const a=applications.find(x=>x.id===id);
  if(!a||!SMS_TPL[type]) return;
  document.getElementById('admin-sms-content').value=SMS_TPL[type](a);
  updateSmsCount('admin-sms');
}

function sendAdminSms(id) {
  const content=document.getElementById('admin-sms-content')?.value||'';
  if(!content.trim()) {showToast('발송 내용을 입력해주세요','warn');return;}
  showToast('문자가 발송되었습니다.','success');
  document.getElementById('admin-sms-content').value='';
  updateSmsCount('admin-sms');
}

          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${p.addons.map(a=>({loan_calc:'💰대출계산기',lease_manager:'📋임차계약관리',progress_tracker:'📊이행진행관리',unit_tracker:'🏠분양세대관리',checklist:'✅체크리스트'}[a]||a)).map(a=>`<span style="font-size:11px;background:var(--blue-light);color:var(--blue);padding:3px 8px;border-radius:10px;font-weight:600">${a}</span>`).join('')}

      <button style="margin-top:12px;width:100%;font-size:12px;padding:8px;background:var(--blue-light);color:var(--blue);border:1px solid #B5D4F4;border-radius:var(--radius);cursor:pointer;font-weight:600" onclick="goApply('${p.id}')">이 상품 접수하기 →</button>
    </div>

function goApply(id) {
  showPage('apply');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.nav-btn:first-child').classList.add('active');
  selectedProduct=id;
  renderProducts();
  renderApplyForm();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ════════════════════════════════════════════
//  EXPORT FUNCTIONS
// ════════════════════════════════════════════
function exportCSV() {
  const headers=['접수번호','신청인','연락처','상품명','보증금액','접수일','상태','메모'];
  const rows=applications.map(a=>[
    a.id, a.name, a.contact, a.product, a.amount, a.date, a.status, a.memo||''
  ]);
  const csvContent=[headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const BOM='\uFEFF';
  downloadFile(BOM+csvContent,'sgi_applications_'+todayFmt()+'.csv','text/csv;charset=utf-8');
  showToast('접수내역 CSV 파일이 다운로드됩니다.','success');
}

function exportJSON() {
  const data={
    exportDate:today(),
    exportTime:new Date().toLocaleTimeString('ko-KR'),
    summary:{
      totalApplications:applications.length,
      totalContracts:contracts.length,
      pendingApplications:applications.filter(a=>a.status==='접수대기').length,
      activeContracts:contracts.filter(c=>c.status==='활성').length,
    },
    applications:applications.map(a=>({...a})),
    contracts:contracts.map(c=>({...c})),
    products:PRODUCTS.map(p=>({id:p.id,name:p.name,cat:p.cat,docs:p.docs,optDocs:p.optDocs,addons:p.addons})),
  };
  downloadFile(JSON.stringify(data,null,2),'sgi_agency_data_'+todayFmt()+'.json','application/json');
  showToast('전체 데이터 JSON 파일이 다운로드됩니다.','success');
}

function downloadFile(content, filename, mimeType) {
  const blob=new Blob([content],{type:mimeType});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ════════════════════════════════════════════
//  UTILITIES
// ════════════════════════════════════════════
function switchTab(btn, panelId) {
  const modal=btn.closest('.modal-body, .page');
  modal.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  modal.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const panel=document.getElementById(panelId);
  if(panel) panel.classList.add('active');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(mo=>{
  mo.addEventListener('click',function(e){if(e.target===this) this.classList.remove('open');});
});

function updateSmsCount(prefix) {
  const len=(document.getElementById(prefix+'-content')?.value||'').length;
  const type=len<=90?'단문':'장문';
  const el=document.getElementById(prefix+'-count');
  if(el) el.textContent=`${len} / 90자 (${type})`;
}

function renderPagination(elId, pages, current, cb) {
  const el=document.getElementById(elId);
  if(!el) return;
  if(pages<=1){el.innerHTML='';return;}
  el.innerHTML=Array.from({length:pages},(_,i)=>`<button class="pg${i+1===current?' active':''}" onclick="(${cb.toString()})(${i+1})">${i+1}</button>`).join('');
}

function updateBadges() {
  const pending=applications.filter(a=>a.status==='접수대기').length;
  document.getElementById('pendingCount').textContent=pending;
  const expiring=contracts.filter(c=>{const d=calcDday(c.endDate);return d>=0&&d<=30&&c.status!=='해지';}).length;
  document.getElementById('expiryCount').textContent=expiring;
}

function showToast(msg, type='info') {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+type;
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.classList.remove('show'),3500);
}

function today() {
  return new Date().toISOString().slice(0,10);
}
function todayFmt() {
  return today().replace(/-/g,'');
}

// ── INIT ──
renderCatFilter();
renderProducts();
updateBadges();
</script>
